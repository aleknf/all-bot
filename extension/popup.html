<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AllBot Session & Auth Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    h1 { font-size: 13px; font-weight: 600; color: #f8fafc; }
    p.sub { font-size: 11px; color: #94a3b8; }
    
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .form-group { margin-bottom: 8px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: 500; }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #f8fafc;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus { border-color: #22c55e; }

    .toggle-pwd {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
    }
    .toggle-pwd:hover { color: #f8fafc; background: transparent; }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 10.5px;
      color: #94a3b8;
      cursor: pointer;
    }
    .remember-row input {
      width: auto;
      cursor: pointer;
      accent-color: #16a34a;
    }

    .auth-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 10.5px;
      font-weight: 500;
    }
    .auth-ok { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.25); color: #4ade80; }
    .auth-need { background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.25); color: #facc15; }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 11px;
    }
    .status-row:last-child { border-bottom: none; }
    .badge {
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 500;
    }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-no { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    button.btn-primary {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      margin-top: 4px;
    }
    button.btn-primary:hover { background: #15803d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .msg-success { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
    .msg-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }

    /* Collapsible Change Password */
    .collapse-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 10.5px;
      cursor: pointer;
      padding: 6px 0 0 0;
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      justify-content: center;
    }
    .collapse-btn:hover { color: #94a3b8; }
    .collapse-content {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #1e293b;
    }
    .btn-secondary {
      width: 100%;
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 7px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-badge">🤖</div>
    <div>
      <h1>AllBot Session & Auth Sync</h1>
      <p class="sub">Autentikasi & sinkronisasi sesi browser ke website VPS</p>
    </div>
  </div>

  <!-- Status Sesi Website Saat Ini -->
  <div id="authBanner" class="auth-banner auth-need">
    <span id="authStatusText">⚪ Memeriksa status login website...</span>
  </div>

  <!-- Form URL & Autentikasi Website -->
  <div class="card">
    <div class="form-group">
      <label>URL Server AllBot Website</label>
      <input type="text" id="serverUrl" value="http://76.13.210.181:4000" placeholder="https://allbot.alllike.cloud atau http://IP:4000" />
    </div>

    <div class="form-group">
      <label>Email Pengguna Website</label>
      <input type="email" id="email" placeholder="admin@alek.internal" />
    </div>

    <div class="form-group">
      <label>Password Website</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="Masukkan password login website Anda" />
        <button type="button" id="btnTogglePwd" class="toggle-pwd" title="Lihat password">👁️</button>
      </div>
    </div>

    <label class="remember-row">
      <input type="checkbox" id="rememberPassword" checked />
      <span>Simpan password di ekstensi ini agar tidak perlu mengetik ulang</span>
    </label>

    <!-- Opsi Ganti Password Website -->
    <button type="button" id="btnToggleChangePwd" class="collapse-btn">
      <span>🔐 Ingin ganti password website? (Klik di sini)</span>
    </button>
    <div id="changePwdPanel" class="collapse-content">
      <div class="form-group">
        <label>Password Baru Website</label>
        <input type="password" id="newPassword" placeholder="Password baru (minimal 6 karakter)" />
      </div>
      <button type="button" id="btnChangePassword" class="btn-secondary">
        Perbarui Password ke Website Server
      </button>
    </div>
  </div>

  <!-- Deteksi Sesi AI di Browser Ini -->
  <div class="card">
    <label style="margin-bottom: 6px;">Status Cookie Browser Ini:</label>
    <div class="status-row">
      <span>🟣 Claude Pro (claude.ai)</span>
      <span id="claudeStatus" class="badge badge-no">Memeriksa...</span>
    </div>
    <div class="status-row">
      <span>🔵 Gemini Advanced (google.com)</span>
      <span id="geminiStatus" class="badge badge-no">Memeriksa...</span>
    </div>
  </div>

  <button id="btnSync" class="btn-primary">
    <span>⚡ Update Auth & Sinkronkan ke Website</span>
  </button>

  <div id="msgBox" class="msg-box"></div>

  <script src="popup.js"></script>
</body>
</html>
