<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AllBot Session Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    h1 { font-size: 14px; font-weight: 600; color: #f8fafc; }
    p.sub { font-size: 11px; color: #94a3b8; }
    
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: 500; }
    input {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #f8fafc;
      font-size: 11px;
      outline: none;
    }
    input:focus { border-color: #22c55e; }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 11px;
    }
    .status-row:last-child { border-bottom: none; }
    .badge {
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 500;
    }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-no { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    button {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover { background: #15803d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
    }
    .msg-success { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
    .msg-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-badge">🤖</div>
    <div>
      <h1>AllBot Session Sync</h1>
      <p class="sub">Sinkronisasi otomatis Claude Pro & Gemini ke VPS</p>
    </div>
  </div>

  <!-- Server & Login Info -->
  <div class="card">
    <div class="form-group">
      <label>URL Server AllBot VPS</label>
      <input type="text" id="serverUrl" value="http://76.13.210.181:4000" placeholder="http://IP_VPS:4000" />
    </div>

    <div id="loginSection">
      <div class="form-group">
        <label>Email Admin</label>
        <input type="email" id="email" value="admin@alek.internal" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" value="AdminPassword2026!" />
      </div>
    </div>
  </div>

  <!-- Detection Status in Current Browser -->
  <div class="card">
    <label style="margin-bottom: 8px;">Status Login di Browser Ini:</label>
    <div class="status-row">
      <span>🟣 Claude.ai</span>
      <span id="claudeStatus" class="badge badge-no">Memeriksa...</span>
    </div>
    <div class="status-row">
      <span>🔵 Gemini.google.com</span>
      <span id="geminiStatus" class="badge badge-no">Memeriksa...</span>
    </div>
  </div>

  <button id="btnSync">
    <span>⚡ Sinkronkan ke VPS Sekarang</span>
  </button>

  <div id="msgBox" class="msg-box"></div>

  <script src="popup.js"></script>
</body>
</html>
