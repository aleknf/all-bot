services:
  allbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allbot-workspace
    restart: unless-stopped
    ports:
      # Port 4000 menyajikan Frontend Web dan Backend WebSocket sekaligus
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:/app/data/allbot.db
      - DEFAULT_LICENSE_KEY=ALLBOT-CORP-DEV-2026
      # Wajib: minimal 32 karakter acak (mis. `openssl rand -hex 32`), taruh di file .env di samping compose
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET wajib diisi}
      # Opsional: password admin awal. Kosong = dibuat acak dan dicetak di log saat seed pertama
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Token langganan Claude untuk provider "Claude CLI": jalankan `claude setup-token` di Mac, tempel ke .env VPS
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - NODE_OPTIONS=--max-http-header-size=128000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Database SQLite dev.db disimpan di volume ini agar tidak hilang saat container restart/update
      - allbot_data:/app/data
    networks:
      - default
      - stack_default

networks:
  default:
  stack_default:
    external: true

volumes:
  allbot_data:
    driver: local
